<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#f2f4f7;
}

.sidebar{

    width:250px;
    height:90vh;
    background:#ffffff;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;

}

/*--------------------------------*/

.top{

    padding:15px;

}

/*--------------------------------*/

.compose{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#f7f7f7;
    font-size:15px;
    cursor:pointer;
    font-weight:600;
}

.compose:hover{

background:#ececec;

}

/*--------------------------------*/

.menu{

    padding:8px 0;

}

/*--------------------------------*/

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 18px;
cursor:pointer;
color:#444;
font-size:15px;
transition:.25s;

}

.item:hover{

background:#f2f2f2;

}

.item.active{

background:#efefef;
font-weight:600;
border-left:4px solid #4c6fff;

}

.item i{

width:20px;

}

/*--------------------------------*/

.section{

padding:18px 18px 8px;
font-size:11px;
font-weight:bold;
color:#9a9a9a;
letter-spacing:1px;
text-transform:uppercase;

}

/*--------------------------------*/

.badge{

background:#f0f0f0;
padding:2px 8px;
border-radius:10px;
font-size:12px;

}

/*--------------------------------*/

.footer{

margin-top:auto;
padding:15px;
font-size:12px;
color:#888;
border-top:1px solid #eee;

}

/*--------------------------------*/

.address{

padding:10px 18px;
font-size:14px;
color:#555;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

}

/*--------------------------------*/

.more{

display:flex;
justify-content:space-between;
align-items:center;

}

</style>
